<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão — caminhada sul</title><style>body{font:16px system-ui;background:#eee;color:#222;margin:24px}canvas{border:1px solid #bbb;image-rendering:pixelated}button,select,input{font:inherit;margin:6px}p{max-width:900px}</style><h1>Revisão da caminhada — sul</h1><p>Oito fases geradas individualmente. Chão de teste avança 6,5 pixels por quadro; confira a estabilidade do apoio. O balanço pode levantar o pé acima do chão. Pontos anatômicos estimados estão no arquivo de rastreamento.</p><label>Velocidade<select id="vel"><option value="100">Normal — 100ms</option><option value="400">Lenta — 400ms</option></select></label><button id="pausa">Pausar</button><button id="passo">Próximo quadro</button><label><input id="chao" type="checkbox" checked>Deslocamento sobre chão marcado</label><label><input id="escuro" type="checkbox">Fundo escuro</label><div><canvas id="tela" width="768" height="640"></canvas></div><p id="estado"></p><script>
const tela=document.querySelector('#tela'),ctx=tela.getContext('2d'),vel=document.querySelector('#vel'),estado=document.querySelector('#estado');let q=0,rodando=true,ultimo=0,total=0;const imagens={};for(const c of ['icaro','eva']){imagens[c]=[];for(let i=1;i<=8;i++){let im=new Image();im.src=c+'/'+String(i).padStart(2,'0')+'.png';imagens[c].push(im)}}
document.querySelector('#pausa').onclick=()=>{rodando=!rodando;document.querySelector('#pausa').textContent=rodando?'Pausar':'Retomar'};document.querySelector('#passo').onclick=()=>{rodando=false;q=(q+1)%8;total++;document.querySelector('#pausa').textContent='Retomar'};
function desenhar(t){if(rodando&&t-ultimo>=+vel.value){q=(q+1)%8;total++;ultimo=t}const escuro=document.querySelector('#escuro').checked,desloca=document.querySelector('#chao').checked;ctx.fillStyle=escuro?'#171b23':'#eee';ctx.fillRect(0,0,768,640);ctx.strokeStyle=escuro?'#435164':'#c1c8cb';for(let y=350;y<640;y+=26){let yy=y-(desloca?total*6.5%26:0);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(768,yy);ctx.stroke()}for(let x=0;x<768;x+=48){ctx.beginPath();ctx.moveTo(x,350);ctx.lineTo(x,640);ctx.stroke()}ctx.imageSmoothingEnabled=false;['icaro','eva'].forEach((c,i)=>{let im=imagens[c][q];if(im.complete)ctx.drawImage(im,i*384,60);ctx.fillStyle=escuro?'white':'black';ctx.fillText(c,i*384+20,30);ctx.fillStyle='#d44';ctx.fillRect(i*384+189,537,6,6)});estado.textContent='Quadro '+String(q+1).padStart(2,'0')+' — '+(rodando?'reproduzindo':'pausado');requestAnimationFrame(desenhar)}requestAnimationFrame(desenhar);
</script></html>
